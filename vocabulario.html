<!doctype html>
<html lang="es-PY">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vocabulario · Che Ñe'ẽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-page="vocabulario">
<a class="skip-link" href="#main">Saltar al contenido</a>
<div id="topnav-root"></div>

<div class="app-shell">
  <main id="main" class="container">
    <div class="page-head">
      <h1>Vocabulario</h1>
      <p>Repasá con tarjetas. Tocá la tarjeta para ver la traducción.</p>
    </div>
    <div class="tabs" id="vocab-tabs"></div>
    <div class="flash-stage">
      <span class="flash-counter" id="vocab-counter"></span>
      <div class="flashcard" id="vocab-flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <span class="badge badge-secondary" id="vocab-front-cat"></span>
            <div class="flashcard-word" id="vocab-front-word"></div>
            <button class="audio-btn-icon" id="vocab-front-audio" aria-label="Escuchar"></button>
            <span class="text-faint" style="font-size:.8rem">Tocá para ver la traducción</span>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="badge badge-primary" id="vocab-back-tag"></span>
            <div class="flashcard-word" id="vocab-back-word" style="font-size:1.5rem"></div>
            <p class="text-soft" id="vocab-back-example" style="font-size:.85rem"></p>
          </div>
        </div>
      </div>
      <div class="flash-btn-row">
        <button class="btn btn-ghost" id="vocab-practice">Necesito practicar</button>
        <button class="btn btn-soft" id="vocab-known">Ya la sé</button>
      </div>
    </div>
  </main>
</div>

<div id="bottomnav-root"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/chrome.js"></script>
<script src="js/vocabulario.js"></script>
</body>
</html>
