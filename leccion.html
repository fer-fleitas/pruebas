<!doctype html>
<html lang="es-PY">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lección · Che Ñe'ẽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/lesson.css">
</head>
<body data-page="leccion">

<div class="lesson-shell">
  <div class="lesson-topbar">
    <button class="icon-btn" id="lesson-exit" aria-label="Salir de la lección"></button>
    <div class="lesson-progress-track"><div class="lesson-progress-fill" id="lesson-progress-fill" style="width:0%"></div></div>
    <div class="lesson-lives" id="lesson-lives"></div>
  </div>

  <main class="lesson-main">
    <div class="lesson-card" id="lesson-card-root"></div>
  </main>

  <div class="feedback-bar" id="lesson-feedback-bar">
    <div class="feedback-inner">
      <div>
        <div class="feedback-title" id="lesson-feedback-title"></div>
        <div class="text-soft" id="lesson-feedback-detail" style="font-size:.88rem"></div>
      </div>
      <button class="btn btn-primary" id="lesson-continue-btn">Continuar</button>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/content-helpers.js"></script>
<script src="js/lesson.js"></script>
</body>
</html>
